name: Deploy on main branch

on:
    push:
        branches:
            - main 

env:
    BACKEND_IMAGE: phall168k/devop-learning-final-app-backend
    FRONTEND_IMAGE: phall168k/devop-learning-final-app-frontend


jobs:
    build-push-deploy:
        name: Build, Push and Deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            # ===================================================
            # Checkout repository
            # ===================================================
            - name: Checkout code
              uses: actions/checkout@v6

            # ===================================================
            # Setup Docker Buildx
            # ===================================================
            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4

            # ===================================================
            # Login to Docker Hub
            # ===================================================
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            # ===================================================
            # Extract short Gt SHA
            # ===================================================
            - name: Extract SHA
              id: vars
              shell: bash
              run: |
                echo "sha=${GITHUB_SHA::7}" > "$GITHUB_OUTPUT"
            
            # ===================================================
            # Build & Push Backend
            # ===================================================
            - name: Build and push Backend image
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                file: ./backend/Dockerfile.prod
                push: true
                tags: |
                    ${{ env.BACKEND_IMAGE }}:latest
                    ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            # ===================================================
            # Build & Push Frontend
            # ===================================================
            - name: Build & push Frontend image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                file: ./frontend/Dockerfile.prod
                push: true
                tags: |
                    ${{ env.FRONTEND_IMAGE }}:latest
                    ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

