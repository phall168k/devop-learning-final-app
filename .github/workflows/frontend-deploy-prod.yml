name: Frontend deploy on frontend-main branch

on:
    push:
        branches:
            - frontend-main

env:
    FRONTEND_IMAGE: phall168k/devop-learning-final-app-frontend

jobs:
    build-push-deploy:
        name: Build, Push and Deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read
        
        steps:
            # ===================================================
            # Checkout repository
            # ===================================================
            - name: Checkout code
              uses: actions/checkout@v6
            
            # ===================================================
            # Setup Docker Buildx
            # ===================================================
            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4

            # ===================================================
            # Login to Docker Hub
            # ===================================================
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            # ===================================================
            # Extract short Git SHA
            # ===================================================
            - name: Extract SHA
              id: vars
              shell: bash
              run: |
                ech "sha=${GITHUB_SHA::7}" > "$GITHUB_OUTPUT"

            # ===================================================
            # Build & Push Frontend
            # ===================================================
            - name: Build and Push Frontend Image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                file: ./frontend/Dockerfile.prod
                push: true
                tags: |
                    ${{ env.FRONTEND_IMAGE }}:latest
                    ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.sha }}
                cache-from: typs=gha
                cache-to: type=gha,mode=max
            
