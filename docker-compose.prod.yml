services:

# =================================
# NestJS
# =================================
  api-prod:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      API_PREFIX: ${API_PREFIX}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    scale: 2
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT}/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_network
    restart: unless-stopped

# =================================
# NuxtJS
# =================================
  frontend-prod:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend-prod
    environment:
      NODE_ENV: production
      HOST: ${HOST}
      PORT: ${PORT}
    expose:
      - "${PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => { if(!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api-prod:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

# =================================
# NGINX
# =================================
  load-balancer-prod:
    image: nginx:alpine
    container_name: load-balancer-prod
    environment:
      API_PORT: ${API_PORT}
      PORT: ${PORT}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
      NGINX_MAX_BODY: ${NGINX_MAX_BODY}
    ports:
      - "80:80"
    depends_on:
      frontend-prod:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - internal_network
      - external_network
    restart: unless-stopped


# =================================
# Network Setup
# =================================
networks:
  internal_network:
    driver: bridge
    internal: true
  external_network:
    driver: bridge