name: devop-learning-final-app-dev

services: 
# =================================
# Postgres
# =================================
  postgres-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TZ: ${DB_TZ}
      PGTZ: ${DB_PGTZ}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

# =================================
# NestJS
# =================================
  backend-dev:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT}
      API_PREFIX: ${API_PREFIX}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT}/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres-dev:
        condition: service_healthy

# =================================
# NuxtJS
# =================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    environment:
      NODE_ENV: production
      HOST: ${HOST}
      PORT: ${PORT}
    ports:
      - "${PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => { if(!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend-dev:
        condition: service_healthy
    
# =================================
# Volumes
# =================================
volumes:
  postgres_dev_data:
    
    
    